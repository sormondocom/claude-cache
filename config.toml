[server]
host = "127.0.0.1"
port = 3000
# node_id is auto-generated on first run and written back here

[api]
model = "claude-sonnet-4-6"
base_url = "https://api.anthropic.com"
# NEVER store api_key here — use ANTHROPIC_API_KEY env var

[local]
enabled      = true
backend      = "ollama"
base_url     = "http://localhost:11434"
model_id     = "gemma4"
confidence_floor = 0.75
timeout_secs = 120

[embedding]
enabled     = true
base_url    = "http://localhost:11434"
model       = "nomic-embed-text"
sim_threshold = 0.88
dimensions  = 768

[cache]
db_path      = "claude-cache.db"
max_size_mb  = 500
default_ttl_secs = 3600

[cache.domain_ttl]
rust       = 86400
python     = 43200
javascript = 21600
typescript = 21600
sql        = 86400
shell      = 7200
assembly   = 604800
general    = 3600

[routing]
novelty_threshold     = 0.60
complexity_threshold  = 0.40
consequence_threshold = 0.30

[budget]
db_path          = "claude-cache.budget.db"
daily_limit_usd  = 0.50
warn_at_pct      = 80
input_per_1k_usd  = 0.003
output_per_1k_usd = 0.015

[federation]
enabled        = false
share_cache    = false
# List peer node URLs, e.g.: peers = ["http://192.168.1.10:3000", "http://peer.example.com:3000"]
peers          = []
lookup_timeout_ms = 500
