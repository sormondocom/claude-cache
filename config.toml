[server]
host = "127.0.0.1"
port = 3000

[api]
# Set to false to disable all upstream Anthropic API calls (cache + local model only).
# Useful when you want to run fully offline or cap costs to zero.
enabled  = true
model    = "claude-sonnet-4-6"
base_url = "https://api.anthropic.com"
# NEVER store api_key here — use ANTHROPIC_API_KEY env var

# "anthropic"   — direct HTTPS to api.anthropic.com (requires ANTHROPIC_API_KEY)
# "claude_code" — spawns the local `claude --print` CLI; works with any Pro/Max subscription
# Auto-detected: if ANTHROPIC_API_KEY is absent, claude_code is used regardless of this field.
backend = "claude_code"

# Retry overloaded_error (capacity pressure, not quota) with exponential backoff.
# Set max_retries = 0 to disable retries and fall through to local model immediately.
max_retries          = 2     # number of retry attempts after the first failure
retry_delay_ms       = 500   # base delay; doubles each attempt (500 → 1000 → 2000ms)

# Timeout for upstream calls (API or claude CLI subprocess).
# Increase for large max_tokens or extended thinking. Requires restart to change.
request_timeout_secs = 300   # 5 minutes

# Process pool for claude_code backend.
# Caps the number of concurrent `claude` subprocesses so the OS isn't overwhelmed.
# 0 = unlimited (not recommended).
claude_code_max_concurrency    = 4   # max simultaneous claude processes
# Seconds a request queues for a free slot before failing with a capacity error.
claude_code_queue_timeout_secs = 30

[local]
enabled      = true
backend      = "ollama"
base_url     = "http://localhost:11434"
model_id     = "gemma4"
confidence_floor = 0.75
timeout_secs = 120

[embedding]
enabled     = true
base_url    = "http://localhost:11434"
model       = "nomic-embed-text"
sim_threshold = 0.88
dimensions  = 768

[cache]
db_path      = "claude-cache.db"
max_size_mb  = 51200 # 50 GB
default_ttl_secs = 2592000  # 30 days

[cache.domain_ttl]
rust       = 2592000  
python     = 2592000
javascript = 2592000  
typescript = 2592000
sql        = 2592000
shell      = 2592000  
assembly   = 2592000  # 30 days
general    = 2592000

[routing]
novelty_threshold     = 0.60
complexity_threshold  = 0.40
consequence_threshold = 0.30
# Draft-verify makes a second API call for near-miss cache entries.
# Disable when on a low-tier API key to reduce rate-limit pressure.
draft_verify_enabled  = false

[budget]
# Set to false when running on a Pro/Max subscription — disables spend gate and recording.
# Hot-reloadable: change here and it takes effect on the next request without a restart.
enabled          = false
db_path          = "claude-cache.budget.db"
daily_limit_usd  = 0.50
warn_at_pct      = 80
input_per_1k_usd  = 0.003
output_per_1k_usd = 0.015

# ── Organic learning (Layer 1: few-shot context injection) ─────────────────────
# When a request reaches the local Ollama model, the proxy looks up the top-K
# most semantically similar prior Q&A pairs from the cache (in the same domain,
# below the cache-serve threshold) and injects them as prior conversation turns.
# The local model answers with the benefit of Claude's prior answers on similar
# prompts — no offline training required.
[learning]
enabled          = true   # set false to disable injection (local model gets raw prompts)
fewshot_k        = 3      # max examples to inject per request
min_sim          = 0.65   # minimum similarity to qualify (below embedding.sim_threshold)
max_answer_chars = 1500   # truncate long answers to keep context manageable
# Layer 2: background distillation of cache entries into domain knowledge documents.
# After distill_min_entries entries accumulate for a domain, the distiller asks the
# local model to synthesize them into a reference doc injected before every local call.
distill_enabled       = true
distill_interval_secs = 3600  # run sweep hourly
distill_min_entries   = 10    # minimum entries before distilling a domain
distill_source_limit  = 20    # max entries to feed into one distillation
# Layer 3: adaptive routing thresholds.
# Watches the routing log for per-domain escalation rates and adjusts the
# novelty threshold so the gate routes more/less traffic locally as the
# local model learns from Layers 1 and 2.
adapt_enabled        = true
adapt_interval_secs  = 900    # check every 15 minutes
adapt_window_secs    = 86400  # look back 24 hours
adapt_min_samples    = 20     # minimum routed samples before adapting
adapt_high_water     = 0.70   # raise threshold above this escalation rate
adapt_low_water      = 0.25   # lower threshold below this escalation rate
adapt_step           = 0.05   # how much to move threshold per step
# Layer 4: explicit quality feedback from ![good]/![bad] annotations.
# How heavily each explicit signal weighs against routing-based escalation counts.
# 2.0 = each ![bad] counts as 2 routing failures; ![good] offsets 2 failures.
# Set to 0 to ignore explicit feedback and rely on escalation rate alone.
adapt_feedback_weight = 2.0
# Layer 5: contrastive failure learning.
# When the local model attempts a prompt but confidence is below the floor, the
# attempt and the correct API response are stored as a contrast pair.  These
# pairs are fed into the distillation synthesis prompt so the local model learns
# not just what good answers look like but specifically what to avoid.
contrast_enabled      = true   # record contrast pairs at escalation time
contrast_in_fewshot   = false  # inject one contrast pair per domain into few-shot
contrast_source_limit = 5      # max contrast pairs per domain in distillation

# ── Node role ─────────────────────────────────────────────────────────────────
# role:               "client" (default) or "cnc"
# auto_promote_peers: CNC only — auto-trust every announcing peer.
#                     Keep false in production; use POST /v1/trust/:node_id instead.
# cnc_url/cnc_node_id: client only — bootstrap trust from this CNC on startup.
#                      Get the CNC fingerprint by running `claude-cache identity`
#                      on the CNC machine.
[node]
role               = "client"
auto_promote_peers = false
cnc_url            = ""
cnc_node_id        = ""

# ── Federation ────────────────────────────────────────────────────────────────
# Each peer requires both url and node_id (Ed25519 fingerprint).
# Get a peer's node_id by running `claude-cache identity` on that machine.
# public_key_hex is optional but enables signature verification before the
# first announce — strongly recommended for production meshes.
#
# Example:
# [[federation.peers]]
# url            = "http://192.168.1.10:3000"
# node_id        = "a3f1..."   # from `claude-cache identity` on that machine
# public_key_hex = ""          # optional

[federation]
enabled        = false
share_cache    = false
lookup_timeout_ms = 500

# ── Rate limits & graceful shutdown ──────────────────────────────────────────
# messages_per_minute: cap on POST /v1/messages.  0 = disabled (not recommended
#                      for shared deployments).  Returns HTTP 429 when exceeded.
# shutdown_timeout_secs: how long to wait for in-flight requests to drain when
#                        a SIGTERM/Ctrl+C is received before forcing exit.
[limits]
messages_per_minute   = 30000
shutdown_timeout_secs = 30

# ── Peer health checks ────────────────────────────────────────────────────────
# Health checks are only active when federation.enabled = true.
# interval_secs: how often to probe each trusted peer's /health endpoint.
# timeout_ms:    max wait per probe.
# failure_threshold: consecutive failures before marking a peer unreachable
#                    (unreachable peers are skipped in federation lookups).
[health]
enabled           = true
interval_secs     = 60
timeout_ms        = 2000
failure_threshold = 3
